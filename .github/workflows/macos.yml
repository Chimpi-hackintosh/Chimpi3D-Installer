name: macOS APP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q main.py
      - run: python -m PyInstaller --clean --noconfirm --onedir --windowed --name Chimpi3D --osx-bundle-identifier com.chimpiai.chimpi3d --collect-all pyqtgraph --collect-all OpenGL main.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Chimpi3D.app Chimpi3D-macOS-Intel.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chimpi3D-macOS-APP
          path: Chimpi3D-macOS-Intel.app.zip
          if-no-files-found: error
