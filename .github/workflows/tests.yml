name: Verificar recursos e instalação do Chimpi3D

on:
  pull_request:
    paths:
      - main.py
      - chimpi_features.py
      - of_cli.py
      - tests/**
      - requirements.txt
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências do projeto
        run: python -m pip install -r requirements.txt
      - name: Conferir sintaxe
        run: python -m compileall -q main.py chimpi_features.py of_cli.py
      - name: Testar recursos e atualização sem acessar o perfil real
        run: python -m unittest discover -s tests -p 'test_v030.py' -v
