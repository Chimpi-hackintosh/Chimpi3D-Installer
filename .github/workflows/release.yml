name: Publicar Chimpi3D nos Releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.py
      - requirements.txt
      - .github/workflows/**

permissions:
  contents: write

jobs:
  windows:
    name: Compilar Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: Compilar Linux
    uses: ./.github/workflows/linux.yml

  macos:
    name: Compilar macOS Intel e Apple Silicon
    uses: ./.github/workflows/macos.yml

  release:
    name: Publicar todos os executáveis no GitHub Releases
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Baixar os quatro pacotes compilados
        uses: actions/download-artifact@v4
        with:
          pattern: Chimpi3D-*
          path: release
          merge-multiple: true

      - name: Conferir os quatro arquivos
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            Chimpi3D.exe \
            Chimpi3D-Linux-x86_64.tar.gz \
            Chimpi3D-macOS-Intel.app.zip \
            Chimpi3D-macOS-AppleSilicon.app.zip
          do
            test -s "release/$name" || { echo "::error::Faltando release/$name"; exit 1; }
          done
          ls -lh release/

      - name: Criar Release e anexar todos os aplicativos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Chimpi3D 0.2.0 • Compilação ${{ github.run_number }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Chimpi3D 0.2.0 • Compilação automática para Windows, Linux e macOS

            - Windows: Chimpi3D.exe
            - Linux x86_64: Chimpi3D-Linux-x86_64.tar.gz (extraia a pasta completa)
            - macOS Intel: Chimpi3D-macOS-Intel.app.zip
            - macOS Apple Silicon: Chimpi3D-macOS-AppleSilicon.app.zip

            Programa experimental. Compilação verificada no GitHub Actions; a interface gráfica não foi testada em todos os computadores
            Os aplicativos para macOS não possuem assinatura digital nem notarização da Apple
          files: |
            release/Chimpi3D.exe
            release/Chimpi3D-Linux-x86_64.tar.gz
            release/Chimpi3D-macOS-Intel.app.zip
            release/Chimpi3D-macOS-AppleSilicon.app.zip
