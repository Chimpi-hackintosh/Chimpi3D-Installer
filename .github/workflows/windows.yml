name: Windows • Executável
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q main.py chimpi_features.py of_cli.py
      - run: python -m unittest discover -s tests -p 'test_v030.py' -v
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Chimpi3D --collect-all pyqtgraph --collect-all OpenGL main.py
      - name: Compilar comando of.exe
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name of of_cli.py
      - name: Preparar NSIS
        uses: nsis-dev/setup-nsis@v1
      - name: Compilar instalador NSIS
        run: makensis /NOCD /V3 installer/windows.nsi
      - name: Confirmar instalador
        shell: pwsh
        run: |
          if (!(Test-Path Chimpi3D-Setup-Windows.exe)) { throw 'Instalador NSIS ausente' }
      - name: Preparar arquivos de download na raiz
        shell: pwsh
        run: |
          Copy-Item dist/Chimpi3D.exe Chimpi3D.exe
          if (!(Test-Path Chimpi3D.exe) -or !(Test-Path Chimpi3D-Setup-Windows.exe)) {
            throw 'Executáveis Windows ausentes'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Chimpi3D-Windows-EXE
          path: |
            Chimpi3D.exe
            Chimpi3D-Setup-Windows.exe
          if-no-files-found: error
