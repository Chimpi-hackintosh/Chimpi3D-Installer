name: Linux Executable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q main.py
      - run: python -m PyInstaller --clean --noconfirm --onefile --name Chimpi3D --collect-all pyqtgraph --collect-all OpenGL main.py
      - run: chmod +x dist/Chimpi3D && tar -czf Chimpi3D-Linux-x86_64.tar.gz -C dist Chimpi3D
      - uses: actions/upload-artifact@v4
        with:
          name: Chimpi3D-Linux-x86_64
          path: Chimpi3D-Linux-x86_64.tar.gz
          if-no-files-found: error
