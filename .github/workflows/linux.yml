name: Linux Executable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar bibliotecas do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0

      - name: Instalar Python e PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller>=6.10,<7'

      - name: Checar codigo e imports sem abrir uma janela
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main.py
          python -c "import numpy, trimesh, PIL, requests, PySide6.QtWidgets, PySide6.QtOpenGLWidgets, pyqtgraph.opengl, OpenGL; print('Imports OK')"

      - name: Compilar Chimpi3D
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m PyInstaller --clean --noconfirm --onedir \
            --name Chimpi3D \
            --hidden-import PySide6.QtOpenGLWidgets \
            --hidden-import pyqtgraph.opengl \
            --exclude-module pyqtgraph.examples \
            --exclude-module pyqtgraph.jupyter \
            --collect-data pyqtgraph \
            --collect-all OpenGL \
            main.py

      - name: Conferir executavel e criar pacote
        run: |
          test -x dist/Chimpi3D/Chimpi3D
          file dist/Chimpi3D/Chimpi3D
          tar -czf Chimpi3D-Linux-x86_64.tar.gz -C dist Chimpi3D
          test -s Chimpi3D-Linux-x86_64.tar.gz

      - name: Publicar artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: Chimpi3D-Linux-x86_64
          path: Chimpi3D-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
